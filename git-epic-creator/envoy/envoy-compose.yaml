static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # Auth service routes (no ext_authz)
                        - match: { prefix: "/authz" }
                          route: { cluster: authentication_service }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        # GitLab OAuth endpoints must be routed to gitlab-client-service (more specific than /auth)
                        # ext_authz stays enabled so the gateway can inject S2S auth + x-user-id.
                        - match: { prefix: "/auth/gitlab" }
                          route: { cluster: gitlab_client_service }
                        - match: { prefix: "/auth" }
                          route: { cluster: authentication_service }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/health" }
                          route: { cluster: authentication_service }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/events" }
                          route:
                            cluster: sse_bridge_service
                            timeout: 0s

                        # Protected API routes (ext_authz enabled)
                        - match: { prefix: "/project" }
                          route: { cluster: project_management_service }
                        - match: { prefix: "/workflow" }
                          route: { cluster: ai_requirements_service }
                        - match: { prefix: "/tasks" }
                          route: { cluster: ai_tasks_service }
                        - match: { prefix: "/gitlab" }
                          route: { cluster: gitlab_client_service }
                        - match: { prefix: "/retrieve" }
                          route: { cluster: neo4j_retrieval_service }

                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      transport_api_version: V3
                      http_service:
                        server_uri:
                          uri: http://authentication-service:8020
                          cluster: authentication_service
                          timeout: 1s
                        path_prefix: /authz
                        authorization_request:
                          headers_to_add:
                            - header:
                                key: x-envoy-original-path
                                value: "%REQ(:PATH)%"
                            - header:
                                key: x-envoy-original-method
                                value: "%REQ(:METHOD)%"
                          allowed_headers:
                            patterns:
                              - exact: cookie
                              - exact: authorization
                              - exact: x-forwarded-proto
                              - exact: x-forwarded-host
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: authorization
                              - exact: x-user-id
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: authentication_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: authentication_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authentication-service
                      port_value: 8020

    - name: sse_bridge_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: sse_bridge_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: sse-bridge-service
                      port_value: 8000

    - name: project_management_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: project_management_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: project-management-service
                      port_value: 8000

    - name: ai_requirements_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ai_requirements_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ai-requirements-service
                      port_value: 8000

    - name: ai_tasks_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ai_tasks_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ai-tasks-service
                      port_value: 8000

    - name: gitlab_client_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: gitlab_client_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: gitlab-client-service
                      port_value: 8000

    - name: neo4j_retrieval_service
      type: STRICT_DNS
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: neo4j_retrieval_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: neo4j-retrieval-service
                      port_value: 8000


