apiVersion: batch/v1
kind: Job
metadata:
  name: postgresdb-schema-init
  namespace: agentic-ai
  labels:
    app: postgresdb-schema-init
    component: init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: postgresdb-schema-init
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: agentic-ai-workload-identity
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db-init-service
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for db-init-service to be ready..."
              until curl -sf http://db-init-service:80/health; do
                echo "Waiting..."
                sleep 5
              done
              echo "db-init-service is ready"
      containers:
        - name: schema-init
          image: python:3.13-slim
          env:
            - name: API_GATEWAY_MINT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentic-ai-secrets
                  key: API_GATEWAY_MINT_SECRET
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          command:
            - python
            - -c
            - |
              import os,json,urllib.request

              mint_secret = os.environ.get("API_GATEWAY_MINT_SECRET", "").strip()
              if not mint_secret:
                  raise SystemExit("API_GATEWAY_MINT_SECRET not set")

              # Mint S2S token via authentication-service
              mint_req = urllib.request.Request(
                  "http://authentication-service:80/auth/s2s/mint",
                  data=json.dumps({"aud": "internal-services"}).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "X-Api-Gateway-Secret": mint_secret,
                  },
              )
              print("POST /auth/s2s/mint")
              with urllib.request.urlopen(mint_req, timeout=60) as resp:
                  mint_body = json.loads(resp.read().decode("utf-8"))
              token = mint_body["access_token"]

              # Initialize DB schema via db-init-service
              init_req = urllib.request.Request(
                  "http://db-init-service:80/db/init",
                  data=b"",
                  method="POST",
                  headers={"Authorization": f"Bearer {token}"},
              )
              print("POST /db/init with gateway S2S Authorization header")
              with urllib.request.urlopen(init_req, timeout=60) as resp:
                  print(resp.status, resp.read().decode("utf-8"))
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: agentic-ai-secrets


