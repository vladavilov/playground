apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: agentic-ai
  labels:
    app: frontend-service
    component: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend-service
          image: frontend-service:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /projects
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /projects
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: agentic-ai
spec:
  selector:
    app: frontend-service
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP



