apiVersion: v1
kind: Secret
metadata:
  name: agentic-ai-secrets
  namespace: agentic-ai
type: Opaque
stringData:
  # Required by gateway control plane session middleware
  SESSION_SECRET_KEY: "local-session-secret-key"

  # Shared JWT signing secret for LOCAL JWTs (dev only)
  LOCAL_JWT_SECRET: "dev-local-jwt-secret"

  # Secret used by gateway control plane to call authentication-service /auth/s2s/mint
  API_GATEWAY_MINT_SECRET: "dev-api-gateway-mint-secret"

  # Postgres / Neo4j
  POSTGRES_PASSWORD: "postgres123"
  NEO4J_PASSWORD: "neo4j123"

  # Redis (not used for auth locally, but some services expect the var)
  REDIS_PASSWORD: ""

  # Azure Storage (Azurite)
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

  # OpenAI (mock)
  OAI_KEY: "local-openai-key"


