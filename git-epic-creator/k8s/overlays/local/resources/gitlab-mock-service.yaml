apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-mock-service
  namespace: agentic-ai
  labels:
    app: gitlab-mock-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-mock-service
  template:
    metadata:
      labels:
        app: gitlab-mock-service
    spec:
      containers:
        - name: gitlab-mock-service
          image: gitlab-mock-service:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: API_PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-mock-service
  namespace: agentic-ai
spec:
  selector:
    app: gitlab-mock-service
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP


