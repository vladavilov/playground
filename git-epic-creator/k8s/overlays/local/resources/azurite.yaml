apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  namespace: agentic-ai
  labels:
    app: azurite
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azurite
  template:
    metadata:
      labels:
        app: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:latest
          args:
            - "azurite"
            - "--skipApiVersionCheck"
            - "--blobHost"
            - "0.0.0.0"
            - "--blobPort"
            - "10000"
            - "--loose"
          ports:
            - containerPort: 10000
              name: blob
          livenessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
  namespace: agentic-ai
spec:
  selector:
    app: azurite
  ports:
    - port: 10000
      targetPort: 10000
      protocol: TCP
  type: ClusterIP


